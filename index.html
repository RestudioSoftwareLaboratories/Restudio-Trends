
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Restudio Trends</title>
    <link rel="icon" href="https://i.postimg.cc/66MLbbg8/restudio-profile.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@100;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <style>
        /* جميع الأنماط كما هي، لم يتم تغيير أي شيء */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #1a1a1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #ffffff;
        }

        .navbar {
            background: #000000;
            padding: 14px 32px 10px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand img {
            height: 40px;
            width: auto;
        }
        .brand .trends-word {
            font-family: 'Tiny5', 'Courier New', monospace;
            font-size: 2.0rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .controls-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings-btn {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px;
            color: #c0c0c8;
            border-radius: 8px;
        }
        .settings-btn i {
            font-size: 22px;
            color: #e0e0e8;
        }
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-overlay.fade-out {
            opacity: 0;
        }
        .modal-panel {
            background: #ffffff;
            border: 1px solid #e0e0e8;
            padding: 28px 24px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            color: #1a1a1e;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
            transform: scale(0.96);
            transition: transform 0.25s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .modal-overlay.active .modal-panel {
            transform: scale(1);
            opacity: 1;
        }
        .modal-overlay.fade-out .modal-panel {
            transform: scale(0.96);
            opacity: 0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-header h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1.3rem;
            color: #1a1a1e;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid #d0d0d8;
            background: #f5f5f8;
            color: #555;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: 0.2s;
        }
        .modal-close:hover {
            background: #e8e8f0;
            border-color: #b0b0b8;
        }
        .setting-group {
            margin-bottom: 22px;
        }
        .setting-label {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }
        .setting-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .option-btn {
            background: #f0f0f5;
            color: #444;
            border: 1px solid #d0d0d8;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 6px;
        }
        .option-btn.active {
            background: #e0e0ea;
            border-color: #8888a0;
            color: #000;
        }
        .option-btn:hover {
            background: #e8e8f0;
        }
        .chart-type-select,
        .region-select {
            background: #f5f5f8;
            color: #1a1a1e;
            border: 1px solid #d0d0d8;
            padding: 10px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            width: 100%;
            border-radius: 6px;
        }
        .chart-type-select option,
        .region-select option {
            background: #ffffff;
            color: #1a1a1e;
        }

        .container {
            max-width: 1280px;
            margin: 20px auto 40px;
            padding: 0 28px;
            width: 100%;
            flex: 1;
        }

        .hero-background {
            position: relative;
            padding: 30px 40px 40px 40px;
            border-radius: 24px;
            margin-bottom: 32px;
            overflow: hidden;
            background: #e8f0e6;
            width: 100%;
            --s: 194px;
            --c1: #f6edb3;
            --c2: #acc4a3;
            --_l: #0000 calc(25% / 3), var(--c1) 0 25%, #0000 0;
            --_g: conic-gradient(from 120deg at 50% 87.5%, var(--c1) 120deg, #0000 0);
            background: var(--_g), var(--_g) 0 calc(var(--s) / 2),
                conic-gradient(from 180deg at 75%, var(--c2) 60deg, #0000 0),
                conic-gradient(from 60deg at 75% 75%, var(--c1) 0 60deg, #0000 0),
                linear-gradient(150deg, var(--_l)) 0 calc(var(--s) / 2),
                conic-gradient(at 25% 25%, #0000 50%, var(--c2) 0 240deg, var(--c1) 0 300deg, var(--c2) 0),
                linear-gradient(-150deg, var(--_l)) #55897c;
            background-size: calc(0.866 * var(--s)) var(--s);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .hero-background::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(1px);
            border-radius: 24px;
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 28px;
            padding-top: 4px;
        }
        .hero-header .sub-line {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            color: #3a4a3a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .hero-header .main-title {
            font-family: 'Ubuntu Sans', sans-serif;
            font-weight: 100;
            font-size: 3.4rem;
            line-height: 1.1;
            color: #0a2a0a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mark-wrapper {
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        .mark-wrapper mark {
            background: linear-gradient(175deg, #fff9c4 0%, #fff176 40%, #ffe082 100%);
            color: #1a2a1a;
            font-weight: 100;
            padding: 2px 8px;
            border-radius: 4px 10px 4px 10px;
            position: relative;
            display: inline-block;
            transform: rotate(-0.8deg);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(200, 180, 80, 0.18), inset 0 -3px 4px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(180, 160, 70, 0.25);
        }

        .mark-wrapper mark::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 4px;
            right: 4px;
            height: 5px;
            background: rgba(140, 120, 40, 0.25);
            border-radius: 50%;
            filter: blur(4px);
            z-index: -1;
        }

        .mark-wrapper:hover mark {
            transform: rotate(-1.2deg) translateY(-1px);
            box-shadow: 0 3px 0px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(200, 180, 80, 0.25), inset 0 -3px 4px rgba(0, 0, 0, 0.03);
        }

        .hero-header .explore-tag {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 1.1rem;
            color: #2a4a2a;
            flex-wrap: wrap;
        }
        .hero-header .explore-tag i {
            font-size: 26px;
            color: #3a7a3a;
        }
        .region-badge-dynamic {
            background: rgba(60, 120, 60, 0.12);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1a5a1a;
            border: 1px solid rgba(60, 120, 60, 0.15);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .region-badge-dynamic i {
            font-size: 18px;
            color: #1a5a1a;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
            flex-wrap: wrap;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
            padding: 6px 6px 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(200, 200, 200, 0.3);
            max-width: 720px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .search-input {
            flex: 1;
            min-width: 180px;
            background: transparent;
            border: none;
            padding: 12px 4px;
            color: #1a2a1a;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            outline: none;
        }
        .search-input::placeholder {
            color: #6a7a6a;
        }

        .btn {
            --fancy-button-gradient-0: #8d49fd;
            --fancy-button-gradient-50: #7f56f3;
            --fancy-button-gradient-100: #5691f3;
            --fancy-button-inner-shadow-top: rgba(233, 209, 255, 0.2);
            --fancy-button-inner-shadow-top-lg: rgba(9, 12, 60, 0.1);
            --fancy-button-inner-shadow-bottom: rgba(137, 222, 246, 0.3);
            --fancy-button-shine-top: #e9d1ff;
            --fancy-button-shine-bottom: #adfff9;
            font-weight: 500;
            font-size: 15px;
            line-height: 21px;
            text-shadow: 0px 0.5px 0.5px rgba(0, 0, 0, 0.2);
            padding: 0;
            margin: 0;
            appearance: none;
            border: none;
            outline: none;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            z-index: 1;
            border-radius: 25px;
            color: #fff;
            background-image: linear-gradient(
                to bottom,
                var(--fancy-button-gradient-0) 0%,
                var(--fancy-button-gradient-50) 50%,
                var(--fancy-button-gradient-100) 100%
            );
            box-shadow:
                0px 4px 12px rgba(9, 12, 60, 0.15),
                0px 2px 8px rgba(9, 12, 60, 0.15),
                0px 1px 3px var(--fancy-button-inner-shadow-top-lg),
                inset 0px 1px 1px var(--fancy-button-inner-shadow-top),
                inset 0px -1px 3px var(--fancy-button-inner-shadow-bottom);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:before,
        .btn:after {
            content: "";
            position: absolute;
            border-radius: inherit;
            will-change: transform;
        }

        .btn:before {
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--fancy-button-shine-top);
            width: 96px;
            height: 6px;
            top: -3px;
            opacity: 0.6;
            filter: blur(6px);
            transition: opacity 0.25s;
        }

        .btn:after {
            inset: 0;
            background-size: cover;
            z-index: 2;
            opacity: 0.3;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .btn span {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            border-radius: inherit;
            overflow: hidden;
            position: relative;
            background-image: linear-gradient(
                to bottom,
                var(--fancy-button-shine-top),
                transparent 8px
            );
            background-position: 0 -6px;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .btn span:before,
        .btn span:after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            background-color: var(--fancy-button-shine-bottom);
            transition:
                opacity 0.25s,
                transform 0.25s;
            will-change: transform;
        }

        .btn span:before {
            width: 92px;
            height: 8px;
            bottom: -4px;
            opacity: 0.75;
            filter: blur(6px);
        }

        .btn span:after {
            width: 112px;
            height: 1px;
            bottom: 0;
            opacity: 0.9;
            filter: blur(1px);
        }

        .btn:hover span:before {
            opacity: 0.8;
        }

        .btn:hover span:before {
            transform: translateX(-50%) scale(1.25);
        }

        .btn:hover span:after {
            opacity: 1;
        }

        .clear-search-btn {
            background: transparent;
            color: #b33a3a;
            border: 1px solid #e0c0c0;
            padding: 10px 18px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 40px;
        }
        .clear-search-btn:hover {
            background: rgba(180, 50, 50, 0.06);
            border-color: #b33a3a;
        }
        .region-select-main {
            background: transparent;
            color: #3a4a3a;
            border: none;
            padding: 10px 4px 10px 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            border-left: 1px solid rgba(200, 200, 200, 0.3);
        }
        .region-select-main option {
            background: #ffffff;
            color: #1a1a1e;
        }

        .trending-in-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #fafafc;
            border: 1px solid #e4e4ec;
            padding: 10px 18px;
            border-radius: 12px;
            flex-wrap: wrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
            transition: border-color 0.25s, box-shadow 0.25s;
            max-width: fit-content;
        }
        .trending-in-box:hover {
            border-color: #d0d0d8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .trending-in-box .fire-icon {
            font-size: 24px;
            color: #ff6d3f;
            animation: fireGlow 1.8s ease-in-out infinite;
        }

        @keyframes fireGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 3px rgba(255, 109, 63, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 8px rgba(255, 109, 63, 0.7));
            }
        }

        .trending-in-box .trending-in-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: #f0f0f5;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e8;
        }
        .trending-in-box .trending-region-pill {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a1a1e;
            background: #ffffff;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1.5px solid #d8d8e0;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .trending-in-box .trending-region-pill .dot {
            width: 7px;
            height: 7px;
            background: #ff6d3f;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.5);
            }
        }

        .trends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 8px 0 32px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e8e8f0;
            padding: 18px 16px 14px;
            transition: border-color 0.25s, box-shadow 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .card:hover {
            border-color: #6a8cff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .rank-badge {
            background: #f0f0f5;
            color: #4a4a52;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 2px 10px;
            border: 1px solid #e0e0e8;
            flex-shrink: 0;
            border-radius: 20px;
        }
        .article-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: #0a0a0e;
            word-break: break-word;
            line-height: 1.3;
            flex: 1;
            font-family: 'Inter', sans-serif;
        }

        .card-image-container {
            width: 100%;
            height: 140px;
            background: #f5f5f8;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid #e8e8f0;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s ease;
        }
        .card-image-container:hover img {

        .image-placeholder {

            height: 100%;

            flex-direction: column;

        }
        .views-count i {

        }

        .card-footer {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            align-items: center;
            justify-content: space-between;
        }
        .footer-left,
        .footer-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .wiki-link {
            color: #4a4a52;
            text-decoration: none;
            border: 1px solid #e0e0e8;
            padding: 4px 12px;
            background: #f8f8fa;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.7rem;
            border-radius: 20px;
        }
        .wiki-link i {
            font-size: 16px;
            color: #6a6a72;
        }
        .wiki-link:hover {
            background: #e8e8f0;

        }
        .share-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #e0e0e8;
            background: #f8f8fa;
            display: flex;
            align-items: center;

            function formatNumber(num) {
                if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
                if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
                return num.toString();
            }

            function getDateRange() {
                const end = new Date();
                const start = new Date();
                start.setDate(end.getDate() - DAYS_RANGE);
                const fmt = (d) =>
                    `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
                return { start: fmt(start), end: fmt(end) };
            }

            async function fetchDailyTop(dateStr, project) {
                const y = dateStr.substring(0, 4),
                    m = dateStr.substring(4, 6),
                    d = dateStr.substring(6, 8);
                const resp = await fetch(
                    `https://wikimedia.org/api/rest_v1/metrics/pageviews/top/${project}.wikipedia/all-access/${y}/${m}/${d}`
                    );
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                return (data?.items?.[0]?.articles || []).map(a => ({ article: a.article, views: a.views }));
            }

            async function aggregateTop30(project) {
                const dateMap = new Map();
                const dateList = [];
                let current = new Date();
                current.setDate(current.getDate() - DAYS_RANGE);
                while (current <= new Date()) {
                    const y = current.getFullYear(),
                        m = String(current.getMonth() + 1).padStart(2, '0'),
                        d = String(current.getDate()).padStart(2, '0');
                    dateList.push(`${y}${m}${d}`);
                    current.setDate(current.getDate() + 1);
                }
                for (const dateStr of dateList) {
                    try {
                        const dayArticles = await fetchDailyTop(dateStr, project);
                        for (const item of dayArticles) {
                            if (!dateMap.has(item.article)) dateMap.set(item.article, { totalViews: 0,
                                daily: {} });
                            const entry = dateMap.get(item.article);
                            entry.totalViews += item.views;
                            entry.daily[dateStr] = (entry.daily[dateStr] || 0) + item.views;
                        }
                        await new Promise(r => setTimeout(r, 40));
                    } catch (e) { console.warn(dateStr, e); }
                }
                const list = Array.from(dateMap.entries()).map(([article, data]) => ({ article,
                    totalViews: data.totalViews, daily: data.daily }));
                list.sort((a, b) => b.totalViews - a.totalViews);
                return list;
            }

            async function fetchWikipediaImage(title, lang) {
                const cacheKey = `${lang}:${title}`;
                if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);
                try {
                    const url =
                        `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error();
                    const data = await res.json();
                    const imgUrl = data?.thumbnail?.source || null;
                    imageCache.set(cacheKey, imgUrl);
                    return imgUrl;
                } catch (err) { imageCache.set(cacheKey, null); return null; }
            }

            function getChartColors() {
                switch (currentColorTheme) {
                    case 'blue':
                        return { main: '#4fc3f7', area: 'rgba(79,195,247,0.2)' };
                    case 'orange':
                        return { main: '#ffb74d', area: 'rgba(255,183,77,0.2)' };
                    case 'green':
                        return { main: '#81c784', area: 'rgba(129,199,132,0.2)' };
                    case 'purple':
                        return { main: '#ce93d8', area: 'rgba(206,147,216,0.2)' };
                    default:
                        return { main: '#6a8cff', area: 'rgba(106,140,255,0.15)' };
                }
            }

            function renderChart(domElement, dates, views, chartType) {
                if (!domElement) return;
                const existing = echarts.getInstanceByDom(domElement);
                if (existing) existing.dispose();
                const chart = echarts.init(domElement, null, { renderer: 'canvas' });
                const colors = getChartColors();
                let seriesOption;
                const xAxisOption = { type: 'category', data: dates, show: false };
                if (chartType === 'bar') {
                    seriesOption = {
                        type: 'bar',
                        data: views,
                        itemStyle: { color: colors.main, borderRadius: [2, 2, 0, 0] },
                        barGap: '30%'
                    };
                } else if (chartType === 'scatter') {
                    const scatterData = views.map((val, idx) => [idx, val]);
                    seriesOption = { type: 'scatter', data: scatterData, symbolSize: 6,
                        itemStyle: { color: colors.main } };
                    xAxisOption.type = 'value';
                    xAxisOption.show = false;
                } else {
                    seriesOption = {
                        type: 'line',
                        data: views,
                        symbol: 'none',
                        lineStyle: { color: colors.main, width: 1.5 },
                        areaStyle: { color: colors.area },
                        smooth: false
                    };
                }
                chart.setOption({
                    grid: { top: 10, right: 10, bottom: 10, left: 10, containLabel: false },
                    xAxis: xAxisOption,
                    yAxis: { type: 'value', show: false },
                    series: [seriesOption],
                    tooltip: { show: false },
                    backgroundColor: 'transparent'
                });
                window.addEventListener('resize', () => chart.resize());
            }

            async function attachImageToCard(cardElement, articleTitle, region) {
                const imgContainer = cardElement.querySelector('.card-image-container');
                if (!imgContainer) return;
                const placeholderDiv = imgContainer.querySelector('.image-placeholder');
                const imgElement = imgContainer.querySelector('img');
                const articleUrl =
                    `https://${region}.wikipedia.org/wiki/${encodeURIComponent(articleTitle)}`;
                imgContainer.style.cursor = 'pointer';
                imgContainer.addEventListener('click', (e) => { e.stopPropagation();
                    window.open(articleUrl, '_blank'); });
                const imageUrl = await fetchWikipediaImage(articleTitle, region);
                if (imageUrl) {
                    if (placeholderDiv) placeholderDiv.style.display = 'none';
                    imgElement.style.display = 'block';
                    imgElement.src = imageUrl;
                    imgElement.alt = articleTitle.replace(/_/g, ' ');
                } else {
                    if (placeholderDiv) {
                        placeholderDiv.innerHTML =
                            `<i class="ti ti-photo-off"></i><span>لا توجد صورة</span>`;
                        placeholderDiv.style.display = 'flex';
                    }
                    imgElement.style.display = 'none';
                }
            }

            function createCard(articleData, rank) {
                const t = translations[currentLanguage];
                const article = articleData.article;
                const totalViews = articleData.totalViews;
                const daily = articleData.daily || {};
                const sortedDates = Object.keys(daily).sort();
                const views = sortedDates.map(d => daily[d]);
                const shortDates = sortedDates.map(d =>
                    `${d.slice(6,8)}/${d.slice(4,6)}`);
                const articleDisplay = article.replace(/_/g, ' ');
                const articleUrl =
                    `https://${currentRegion}.wikipedia.org/wiki/${encodeURIComponent(article)}`;
                const tweetText = encodeURIComponent(
                    `${articleDisplay} - ${formatNumber(totalViews)} ${t.views} على ويكيبيديا`);
                const tweetUrl =
                    `https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(articleUrl)}`;
                const rankColors = ['#6a8cff', '#ffb74d', '#81c784', '#e57373', '#ba68c8', '#4fc3f7',
                    '#ffb74d', '#81c784', '#e57373', '#ba68c8', '#6a8cff', '#ffb74d'
                ];
                const rankColor = rankColors[(rank - 1) % rankColors.length];
                const chartId = `chart-${Date.now()}-${rank}-${Math.random()}`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="rank-badge" style="color:${rankColor}; border-color:${rankColor}40;">#${rank}</span>
                        <span class="article-title" title="${articleDisplay}">${articleDisplay}</span>
                    </div>
                    <div class="card-image-container" data-article="${article}">
                        <div class="image-placeholder" style="display:flex; align-items:center; justify-content:center; height:100%; gap:6px;">
                            <i class="ti ti-photo"></i><span>جاري تحميل الصورة...</span>
                        </div>
                        <img style="display:none; width:100%; height:100%; object-fit:cover;" alt="${articleDisplay}">
                    </div>
                    <div class="chart-container" id="${chartId}" data-dates='${JSON.stringify(shortDates)}' data-views='${JSON.stringify(views)}'></div>
                    <div class="views-info">
                        <span>${t.lastDays}</span>
                        <span class="views-count" style="color:${rankColor};"><i class="ti ti-eye"></i> ${formatNumber(totalViews)} ${t.views}</span>
                    </div>
                    <div class="card-footer">
                        <div class="footer-left"><a href="${articleUrl}" target="_blank" class="wiki-link"><i class="ti ti-world"></i> ${t.wikipedia}</a></div>
                        <div class="footer-right"><a href="${tweetUrl}" target="_blank" class="share-btn twitter"><i class="ti ti-brand-x"></i></a></div>
                    </div>
                `;
                setTimeout(() => {
                    const chartDiv = document.getElementById(chartId);
                    if (chartDiv && views.length) renderChart(chartDiv, shortDates, views,
                        currentChartType);
                    attachImageToCard(card, article, currentRegion);
                }, 15);
                return card;
            }

            function refreshAllCharts() {
                document.querySelectorAll('.chart-container').forEach(container => {
                    const datesAttr = container.getAttribute('data-dates');
                    const viewsAttr = container.getAttribute('data-views');
                    if (datesAttr && viewsAttr) {
                        try { const dates = JSON.parse(datesAttr);
                            const views = JSON.parse(viewsAttr);
                            renderChart(container, dates, views, currentChartType); } catch (e) {}
                    }
                });
            }

            function appendCards(startIdx, count) {
                const slice = fullTrendsList.slice(startIdx, startIdx + count);
                slice.forEach((item, i) => { const rank = startIdx + i + 1;
                    GRID.appendChild(createCard(item, rank)); });
                displayedCount = startIdx + slice.length;
                LOAD_MORE_CONTAINER.style.display = (displayedCount >= fullTrendsList.length) ? 'none' :
                    'flex';
            }

            function resetGrid() { GRID.innerHTML = '';
                displayedCount = 0;
                LOAD_MORE_CONTAINER.style.display = 'none'; }

            function renderSkeletons(count = 12) {
                GRID.innerHTML = '';
                for (let i = 0; i < count; i++) {
                    const skel = document.createElement('div');
                    skel.className = 'card';
                    skel.innerHTML =
                        `<div class="skeleton skeleton-img"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-chart"></div><div class="skeleton skeleton-text"></div>`;
                    GRID.appendChild(skel);
                }
            }

            async function loadTrendsList(project) {
                isLoadingTrends = true;
                isSearchMode = false;
                CLEAR_SEARCH_BTN.style.display = 'none';
                SEARCH_INPUT.value = '';
                resetGrid();
                renderSkeletons(12);
                try {
                    fullTrendsList = await aggregateTop30(project);
                    resetGrid();
                    if (fullTrendsList.length === 0) GRID.innerHTML =
                        `<div class="error-state">${translations[currentLanguage].error}</div>`;
                    else appendCards(0, BATCH_SIZE);
                } catch (e) { GRID.innerHTML =
                        `<div class="error-state">${translations[currentLanguage].errorGeneral}</div>`; } finally { isLoadingTrends =
                        false; }
            }

            async function searchArticle(query) {
                if (!query.trim()) { loadTrendsList(currentRegion); return; }
                isSearchMode = true;
                CLEAR_SEARCH_BTN.style.display = 'inline-flex';
                resetGrid();
                renderSkeletons(1);
                const { start, end } = getDateRange();
                const url =
                    `https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/${currentRegion}.wikipedia/all-access/user/${encodeURIComponent(query.trim())}/daily/${start}/${end}`;
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error();
                    const data = await resp.json();
                    const items = data.items || [];
                    const totalViews = items.reduce((s, i) => s + i.views, 0);
                    const daily = Object.fromEntries(items.map(i => [i.timestamp, i.views]));
                    GRID.innerHTML = '';
                    const articleData = { article: query.trim(), totalViews, daily };
                    GRID.appendChild(createCard(articleData, 1));
                    LOAD_MORE_CONTAINER.style.display = 'none';
                } catch { GRID.innerHTML =
                        `<div class="error-state">${translations[currentLanguage].error}</div>`;
                    LOAD_MORE_CONTAINER.style.display = 'none'; }
            }

            function clearSearch() { isSearchMode = false;
                CLEAR_SEARCH_BTN.style.display = 'none';
                SEARCH_INPUT.value = '';
                loadTrendsList(currentRegion); }

            function openModal() {
                SETTINGS_MODAL.classList.remove('fade-out');
                SETTINGS_MODAL.style.display = 'flex';
                void SETTINGS_MODAL.offsetWidth;
                SETTINGS_MODAL.classList.add('active');
            }

            function closeModal() {
                SETTINGS_MODAL.classList.add('fade-out');
                SETTINGS_MODAL.classList.remove('active');
                setTimeout(() => {
                    SETTINGS_MODAL.style.display = 'none';
                    SETTINGS_MODAL.classList.remove('fade-out');
                }, 300);
            }

            REGION_SELECT.addEventListener('change', (e) => {
                currentRegion = e.target.value;
                updateRegionBadge();
                if (isSearchMode) clearSearch();
                else loadTrendsList(currentRegion);
            });
            SEARCH_BTN.addEventListener('click', () => searchArticle(SEARCH_INPUT.value));
            SEARCH_INPUT.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchArticle(
                    SEARCH_INPUT.value); });
            CLEAR_SEARCH_BTN.addEventListener('click', clearSearch);
            LOAD_MORE_BTN.addEventListener('click', () => { if (!isSearchMode && fullTrendsList.length >
                    displayedCount) appendCards(displayedCount, BATCH_SIZE); });
            SETTINGS_BTN.addEventListener('click', openModal);
            CLOSE_SETTINGS_BTN.addEventListener('click', closeModal);
            SETTINGS_MODAL.addEventListener('click', (e) => { if (e.target === SETTINGS_MODAL) closeModal
            (); });
            MODAL_CHART_TYPE.addEventListener('change', (e) => { currentChartType = e.target.value;
                refreshAllCharts(); });
            MODAL_COLOR_THEME.addEventListener('change', (e) => { currentColorTheme = e.target.value;
                refreshAllCharts(); });
            MODAL_LANG_AR.addEventListener('click', () => setLanguage('ar'));
            MODAL_LANG_EN.addEventListener('click', () => setLanguage('en'));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && SETTINGS_MODAL.classList
                    .contains('active')) closeModal(); });

            setLanguage('ar');
            currentRegion = 'ar';
            REGION_SELECT.value = 'ar';
            updateRegionBadge();
            loadTrendsList('ar');
        })();
    </script>
</body>
</html>
